[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-agent-llm-tools-rag"
version = "0.1.0"
description = "Reference LangGraph agent with tools and RAG using ChromaDB"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rodolfo Salas" }]
dependencies = [
  "langgraph>=0.2.60",
  "langchain>=0.3.14",
  "langchain-openai>=0.2.14",
  "langchain-community>=0.3.14",
  "langchain-chroma>=0.1.4",
  "chromadb>=0.5.23",
  "pydantic>=2.10.4",
  "pydantic-settings>=2.7.0",
  "python-dotenv>=1.0.1",
  "typer>=0.15.1",
  "rich>=13.9.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-mock>=3.14.0",
]

[project.scripts]
ai-agent = "ai_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_agent"]

[tool.hatch.build.targets.sdist]
include = ["src/ai_agent", "data/knowledge", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
